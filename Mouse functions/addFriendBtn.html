<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Friend Button</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        html, body{
            height: 100%;
            width: 100%;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: green;
        }
        #card{
            border-radius: 10px;
            height: 380px;
            width: 350px;
            background-color: #fff;
            text-align: center;
            padding: 20px 20px 2px 20px;
        }
        #card img{
            height: 50%;
            width: 100%;
            object-fit: cover;
            object-position: center;
            border-radius: 10px;
        }
        #card h1{
            font-size: 25px;
            font-weight: 600;
        }
        #card h5{
            font-size: 25px;
            margin: 20px;
            color: red;
        }
        #card button{
            background-color: rgb(49, 49, 192);
            color: #fff;
            font-weight: 700;
            padding: 12px 20px;
            border-radius: 5px;
            border: none;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="card">
        <img src="https://images.unsplash.com/photo-1611417361507-7d77bbc20a73?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wszzYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
        <h1>Angelina</h1>
        <h5>Stranger</h5>
        <div id="btn-containter">
            <button id="addFriend">Add Friend</button>
        </div>
    </div>

    <script>
        let h5 = document.querySelector("h5");
        let check = 0
        let btn = document.querySelector("#addFriend")
        btn.addEventListener("click",function(){
            if(check == 0){
                check = 1
                h5.innerHTML = "Friend"
                h5.style.color = "green"
                btn.innerHTML = "Remove Friend";
            }
            else{
                check = 0
                h5.innerHTML = "Stranger"
                h5.style.color = "red"
                btn.innerHTML = "Add Friend";
            }
        })
        </script>
</body>
</html>
