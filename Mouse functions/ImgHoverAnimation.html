<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Hover Animation</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
        }
        html, body{
            height: 100%;
            width: 100%;
            background-color: #111;
            position: relative;
        }
        .elem{
            height: 120px;
            width: 100%;
            border-bottom: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }
        .elem h1{
            font-size: 6vw;
            position: relative;
            z-index: 9;
            mix-blend-mode: difference;
        }
        .elem img{
            height: 150px;
            width: 150px;
            object-fit: cover;
            object-position: center;
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            transition: all 0.2s linear;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="elem1" class="elem">
            <h1>Oppenheimer</h1>
            <img src="https://plus.unsplash.com/premium_photo-1675791188810-3a01768c1e2f?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fHBlcnNvbnxlbnwwfHwwfHx8MA%3D%3D" alt="">
        </div>

        // short way
        let elems = document.querySelectorAll(".elem");
        elems.forEach((elem)=>{
            let img = elem.querySelector("img");
            elem.addEventListener("mouseenter", (e)=>{
                img.style.opacity = 1;
            });
            elem.addEventListener("mouseleave", (e)=>{
                img.style.opacity = 0;
            });
            elem.addEventListener("mousemove", (e)=>{
                img.style.left = e.clientX +"px";
            });
        });
    </script>
