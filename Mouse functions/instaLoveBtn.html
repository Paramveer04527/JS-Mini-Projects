<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Like Button</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <style>
        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }
        html, body{
            height: 100%;
            width: 100%;
        }
        body{
            background-color: lightseagreen;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #container{
            height: 400px;
            width: 350px;
            border-radius: 10px;
            background-color: #fff;
            position: relative;
            overflow: hidden;
        }
        #container img{
            border-radius: 10px;
            height: 100%;
            width: 100%;
            object-fit: cover;
            object-position: top;
        }
        #container i{
            color: #fff;
            font-size: 50px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            transition: transform 0.4s ease;
        }
    </style>
</head>
<body>
    <div id="container">
        <img src="https://images.unsplash.com/photo-1609505848912-b7c3b8b4beda?q=80&w=765&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
        <i class="ri-heart-fill"></i>
    </div>

    <script>
        let container = document.getElementById("container");
        let heart = container.querySelector("i");

        container.addEventListener("dblclick", function() {
            heart.style.transform = "translate(-50%, -50%) scale(1)";
            heart.style.opacity = "1";

            setTimeout(function() {
                heart.style.transform = "translate(-50%, -50%) scale(0)";
                heart.style.opacity = "0";
            }, 1000);

        });

    </script>
</body>
</html>
