<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Feature</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
        }
        html, body{
            height: 100%;
            width: 100%;
        }
        body{
            background-color: rgb(6, 180, 180);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #card{
            height: 450px;
            width: 300px;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid black;
            position: relative;

        }
        #stories{
            height: 120px;
            width: 100%;
            padding: 20px;
            border-bottom: 1px solid black;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
        }
        #stories::-webkit-scrollbar{
            display: none;
        }
        .story{
            height: 80px;
            width: 80px;
            border-radius: 50%;
            border: 3px solid red;
            display: inline-block;
            overflow: hidden;
            margin-right: 5px;
        }
        .story img{
            height: 100%;
            width: 100%;
            object-fit: cover;
            object-position: top;
        }
        #full-screen{
            height: 100%;
            width: 100%;
            background-size: cover;
            background-position: center;
            position: absolute;
            display: none;
        }
    </style>
</head>
<body>
    <div id="card">
        <div id="full-screen">
        </div>
        <div id="stories">
        </div>
    </div>

    <script>
        let arr = [
            {dp: "https://images.unsplash.com/photo-1609505848912-b7c3b8b4beda?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8Z2lybHN8ZW58MHx8MHx8fDA%3D", story: "https://images.unsplash.com/photo-1774646060102-e9f1a2fa7680?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8Z2lybHN8ZW58MHx8MHx8fDA%3D"},
            {dp: "https://images.unsplash.com/photo-1598507619174-04d674f7fb95?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8Z2lybHN8ZW58MHx8MHx8fDA%3D", story: "https://images.unsplash.com/photo-1767004307297-33342973a54f?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8Z2lybHN8ZW58MHx8MHx8fDA%3D"},
            {dp: "https://plus.unsplash.com/premium_photo-1665663927708-e3287b105c44?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8Z2lybHN8ZW58MHx8MHx8fDA%3D", story: "https://images.unsplash.com/photo-1620196639702-311ce41b2be9?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fGdpcmxzfGVufDB8fDB8fHww"},
            {dp: "https://images.unsplash.com/photo-1611880147493-7542bdb0f024?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTl8fGdpcmxzfGVufDB8fDB8fHww", story: "https://images.unsplash.com/photo-1631947430066-48c30d57b943?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTh8fGdpcmxzfGVufDB8fDB8fHww"},
            {dp: "https://plus.unsplash.com/premium_photo-1690407617542-2f210cf20d7e?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mjd8fGdpcmxzfGVufDB8fDB8fHww", story: "https://images.unsplash.com/photo-1601288496920-b6154fe3626a?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGdpcmxzfGVufDB8fDB8fHww"}
        ]
        
        let fullScreen = document.querySelector("#full-screen")
        let stories = document.querySelector("#stories");

        let clutter = "";
        arr.forEach(function(elem,index){
            clutter += `<div class="story">
                <img id="${index}" src="${elem.dp}" alt="">
            </div>`;
        })
        
        stories.innerHTML = clutter;
        stories.addEventListener("click",function(dets){
            fullScreen.style.display = "block";
            fullScreen.style.backgroundImage = `url(${arr[dets.target.id].story})`;
        })

        setTimeout(function(){
            fullScreen.style.display = "none";
        },3000)
    </script>
</body>
</html>
