<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Search Filter UI</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-5xl">
      <!-- Header -->
      <div class="text-center mb-10">
        <h1 class="text-4xl font-bold text-gray-800 mb-3">Find Your Profile</h1>
        <p class="text-gray-500">
          Search for people and discover their profiles.
        </p>
      </div>

      <!-- Search Bar -->
      <div class="max-w-xl mx-auto mb-10">
        <div class="relative">
          <input
            type="text"
            id="searchInput"
            accesskey="enter"
            ;
            placeholder="Search by name or bio..."
            class="w-full px-5 py-4 pl-12 rounded-2xl border border-gray-200 bg-white shadow-sm outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
          />

          <!-- Search Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0
               7.5 7.5 0 0 1 15 0Z"
            />
          </svg>
        </div>
      </div>

      <!-- Profile Cards -->
      <div
        id="profileContainer"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </div>

    <script>
      let inp = document.querySelector("#searchInput");
      let profileContainer = document.querySelector("#profileContainer");
      let users = [
        {
          name: "Sarah Williams3",
          profilePicture:
            "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200",
          bio: "Designer focused on creating meaningful experiences through creativity and thoughtful design.",
        },
        {
          name: "Sarah Jay",
          profilePicture:
            "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200",
          bio: "Designer focused on creating meaningful experiences through creativity and thoughtful design.",
        },
        {
          name: "Michael Smith",
          profilePicture:
            "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200",
          bio: "Enjoys building scalable applications, working with databases, and solving complex problems.",
        },
        {
          name: "Emily Davis",
          profilePicture:
            "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200",
          bio: "Exploring design systems, user research, and innovative product experiences.",
        },
        {
          name: "David Brown",
          profilePicture:
            "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200",
          bio: "Building full-stack web applications and learning modern JavaScript technologies.",
        },
        {
          name: "Jessica Wilson",
          profilePicture:
            "https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=200",
          bio: "Interested in data visualization, analytics, and transforming information into insights.",
        },
      ];

      inp.addEventListener("input", function (val) {
        let value = val.target.value;
        showUsers(value);
      });

      function showUsers(arr) {
        profileContainer.innerHTML = "";

        let matchCount = 0;

        users.filter(function (user) {
          if (user.name.toLowerCase().includes(arr.toLowerCase().trim())) {
            matchCount++;

            let card = document.createElement("div");
            card.className =
              "profile-card bg-white rounded-3xl overflow-hidden shadow-md";

            // Background section
            let background = document.createElement("div");
            background.className = "h-40 relative";

            let backgroundImg = document.createElement("img");
            backgroundImg.src = user.profilePicture;
            backgroundImg.alt = "Profile background";
            backgroundImg.className = "w-full h-full object-cover";

            let overlay = document.createElement("div");
            overlay.className = "absolute inset-0 bg-black/20";

            background.append(backgroundImg, overlay);

            // Content section
            let content = document.createElement("div");
            content.className = "p-6 text-center";

            // Profile picture
            let profileImg = document.createElement("img");
            profileImg.src = user.profilePicture;
            profileImg.alt = user.name;
            profileImg.className =
              "w-24 h-24 rounded-full object-cover border-4 border-white shadow-md mx-auto -mt-16 relative";

            // Name
            let name = document.createElement("h2");
            name.className =
              "profile-name text-xl font-bold text-gray-800 mt-4";
            name.textContent = user.name;

            // Bio
            let bio = document.createElement("p");
            bio.className =
              "profile-bio text-gray-500 text-sm mt-4 leading-relaxed";
            bio.textContent = user.bio;

            // Button
            let button = document.createElement("button");
            button.className =
              "mt-5 px-6 py-2 rounded-full bg-indigo-600 text-white text-sm";
            button.textContent = "View Profile";

            // Append content elements
            content.append(profileImg, name, bio, button);

            // Append everything into one card
            card.append(background, content);
            profileContainer.appendChild(card);
          }
        });

        // No results message
        if (matchCount === 0) {
          let message = document.createElement("p");

          message.className =
            "text-center text-gray-500 text-lg col-span-full mt-10";

          message.textContent = "No users found";

          profileContainer.appendChild(message);
        }
      }
      showUsers("");
    </script>
  </body>
</html>
